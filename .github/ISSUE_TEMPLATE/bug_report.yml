name: Bug report / Signaler un bug
description: Something does not work as expected in PC Toolkit (English or French).
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting the problem. **HTML/TXT exports and the console contain your PC name, your hardware and sometimes personal paths: review them and redact this information before attaching them.**
  - type: input
    id: app-version
    attributes:
      label: PC Toolkit version
      description: Shown at the bottom of the sidebar and in every report (`VERSION` file).
      placeholder: "1.7.1"
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Windows version
      description: "Run `winver`."
      placeholder: "Windows 11 23H2 (build 22631)"
    validations:
      required: true
  - type: input
    id: ps-version
    attributes:
      label: PowerShell version
      description: "Run `$PSVersionTable.PSVersion` (Windows PowerShell 5.1 expected)."
      placeholder: "5.1.22621.4391"
  - type: dropdown
    id: privileges
    attributes:
      label: Run mode
      options:
        - Standard mode
        - Administrator
        - I don't know
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Page concerned
      options:
        - Dashboard
        - Hardware
        - Network
        - Windows
        - Storage
        - Audio
        - Maintenance
        - Startup
        - Performance Mode (Game / Music production / Office presets)
        - Security Guard
        - Before/after report
        - History
        - Installation / launch
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open "Performance Mode"
        2. Click "Game preset…"
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console, error message, screenshots
      description: Paste the lines from the built-in console or drop a screenshot (without PC name or personal data).
