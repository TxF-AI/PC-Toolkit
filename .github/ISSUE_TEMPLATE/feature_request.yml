name: Feature request / Proposer une fonctionnalité
description: An idea to improve PC Toolkit (English or French).
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: Need
      description: What problem do you want to solve? Who is affected (gamer, musician, office use…)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe what the tool should do (page, button, behavior).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Current workarounds, other tools.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Diagnostics (read-only)
        - Maintenance / cleanup
        - Performance Mode / presets
        - Security Guard
        - Before/after report
        - Interface
        - Installation
        - Other
  - type: checkboxes
    id: rules
    attributes:
      label: Product rules
      options:
        - label: Diagnostics stay read-only.
        - label: Any action that changes the system has a preview and a confirmation.
        - label: No external dependency and no data sent over the Internet.
        - label: Measurements that Windows does not expose are shown as "Not available".
